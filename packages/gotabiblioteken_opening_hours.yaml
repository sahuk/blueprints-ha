# Götabiblioteken opening-hours source
# =====================================
# Polls the Axiell opening-hours JSON API and exposes the raw `dates` structure
# as an attribute. The `gotabiblioteken/opening_hours.yaml` template blueprint
# reads this attribute to build per-library sensors.
#
# This part cannot be a blueprint: Home Assistant blueprints only cover
# automations, scripts and template entities – none of which can perform an
# HTTP request. The REST sensor below is the "subscribe to the API" half; the
# blueprint is the reusable "turn it into a library sensor" half.
#
# Enable packages once in configuration.yaml:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then copy this file into your <config>/packages/ directory.
#
# The customer id in the URL (637ce8087143292d469b8c9b) is Götabiblioteken's.
# daysFromNow=0&numOfDays=2 fetches today + tomorrow, keeping the payload small.

rest:
  - resource: "https://api.axiell.com/openinghours/customers/637ce8087143292d469b8c9b/openinghours?locale=sv_SE&daysFromNow=0&numOfDays=2"
    method: GET
    scan_interval: 3600
    timeout: 20
    headers:
      Accept: "application/json"
    sensor:
      - name: "Götabiblioteken öppettider (rådata)"
        unique_id: gotabiblioteken_opening_hours_raw
        # State changes at most once per day, so it barely touches the recorder.
        # All the useful data lives in the `dates` attribute.
        value_template: "{{ value_json.dates[0].date if value_json.dates else 'unknown' }}"
        json_attributes:
          - dates

# Optional: the `dates` attribute is large-ish. If you don't want it in your
# long-term history, exclude it from the recorder in configuration.yaml:
#
#   recorder:
#     exclude:
#       entities:
#         - sensor.gotabiblioteken_oppettider_radata
